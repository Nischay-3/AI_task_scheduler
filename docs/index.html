<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Scheduler with AI Summary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>Task Scheduler with AI Summary</h1>
      <p>Organize your tasks, get smart schedule suggestions, and see reminders for due/overdue tasks. All logic is handled by Python on the server.</p>
    </header>
    <div class="status-box" id="status-message" style="display:none;"></div>
    <form id="task-form" class="task-form" style="margin-bottom: 24px;">
      <input type="text" id="task-title" placeholder="Task Title" required>
      <textarea id="task-description" placeholder="Description (optional)"></textarea>
      <input type="datetime-local" id="task-due" required>
      <button type="submit" class="btn-add">Add Task</button>
    </form>
    <div id="ai-summary"></div>
    <section class="task-section">
      <h2>Your Tasks</h2>
      <ul id="task-list"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
