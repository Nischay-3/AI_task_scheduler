<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Task Scheduler</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>AI Task Scheduler & Reminder</h1>
      <p>Organize your tasks, send email reminders, and get a smart suggested plan instantly.</p>
    </header>

    <form id="task-form">
      <input type="text" id="task-title" placeholder="Task Title" required>
      <textarea id="task-description" placeholder="Description (optional)"></textarea>
      <input type="datetime-local" id="task-due" required>
      <input type="email" id="task-email" placeholder="Reminder Email (optional)">
      <button type="submit" class="btn-add">Add Task</button>
    </form>

    <button id="optimize-btn" class="btn-optimize">Get Optimized Schedule</button>

    <div id="status-message" class="status-message"></div>
    <div id="suggestion"></div>

    <section class="task-section">
      <h2>Your Tasks</h2>
      <ul id="task-list"></ul>
    </section>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
