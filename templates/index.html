<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Task Scheduler & Reminder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>🤖 AI Task Scheduler & Reminder</h1>
    
    <form id="task-form">
      <input type="text" id="task-title" placeholder="Task Title" required>
      <textarea id="task-description" placeholder="Description (optional)"></textarea>
      <input type="datetime-local" id="task-due" required>
      <button type="submit" class="btn-add">Add Task</button>
    </form>
    
    <button id="optimize-btn" class="btn-optimize">Optimize Schedule with AI</button>
    
    <div id="suggestion"></div>
    
    <h2>Your Tasks</h2>
    <ul id="task-list"></ul>
  </div>
  
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
