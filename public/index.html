<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Task Scheduler & Reminder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>AI Task Scheduler & Reminder</h1>
    <form id="task-form">
      <input type="text" id="task-title" placeholder="Task Title" required>
      <textarea id="task-description" placeholder="Description"></textarea>
      <input type="datetime-local" id="task-due" required>
      <button type="submit">Add Task</button>
    </form>
    <button id="optimize-btn">Optimize Schedule with AI</button>
    <div id="suggestion"></div>
    <ul id="task-list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
